[package]
name = "collect_core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
data-encoding = "2.11.1"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
hex = "0.4.3"
jsonschema = { version = "0.60.2", default-features = false, features = ["resolve-file"] }
rand = "0.10.3"
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
